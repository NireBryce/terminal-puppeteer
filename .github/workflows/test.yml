name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # pty is POSIX-only, and so is this tool -- ubuntu-latest only, no OS matrix.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Stdlib only, both the tool and its tests -- no install step needed.
      - run: python3 -m unittest discover tests -v
      - run: python3 terminal-puppeteer.py --help
