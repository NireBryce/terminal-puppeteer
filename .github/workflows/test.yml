name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # pty is POSIX-only, and so is this tool -- ubuntu-latest only, no OS matrix.
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.14 is what this project's own author machine and the nix
        # build run; 3.9 is the supported floor.
        python-version: ["3.9", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # The two fish integration tests skip where fish is absent; the
      # suite was verified against fish 4.x, so CI installs that series
      # (distro repos carry 3.x, whose startup-probing behavior differs).
      - run: |
          sudo add-apt-repository -y ppa:fish-shell/release-4
          sudo apt-get update
          sudo apt-get install -y fish
      # The ssh-transport tests need a real sshd: runners have
      # openssh-server installed but not running. Start it and let the
      # runner authenticate to itself (public repo, so minutes are free,
      # and the step costs seconds) -- same reasoning as the fish PPA
      # above: without this the tests run only on the author machine.
      - name: start sshd for the ssh-transport tests
        run: |
          sudo systemctl start ssh || sudo systemctl start sshd
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
      # Stdlib only, both the tool and its tests -- no install step needed.
      - run: python3 -m unittest discover tests -v
      - run: python3 terminal-puppeteer.py --help

  packaging:
    # The wheel round-trip: build the wheel, install it into a scratch
    # venv, and run the installed entry point from OUTSIDE the checkout.
    # Guards #30's historical failure mode -- a wrapper that shadowed the
    # package it imported was invisible when running in place and only
    # broke from an installed run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - run: python3 -m pip install build
      - run: python3 -m build
      # README promises the man page ships with an install; data-files
      # are a deprecated setuptools feature, so assert it every push --
      # the day it silently stops working, this fails before a release
      # does.
      - run: python3 -m zipfile -l dist/*.whl | grep -q share/man/man1/terminal-puppeteer.1
      - run: |
          python3 -m venv /tmp/scratch-venv
          /tmp/scratch-venv/bin/pip install dist/*.whl
      - run: |
          test -f /tmp/scratch-venv/share/man/man1/terminal-puppeteer.1
          man --warnings -l /tmp/scratch-venv/share/man/man1/terminal-puppeteer.1
      - run: |
          cd /tmp
          /tmp/scratch-venv/bin/terminal-puppeteer --version
          /tmp/scratch-venv/bin/terminal-puppeteer --list-keys
          printf "hi\nENTER\n" | /tmp/scratch-venv/bin/terminal-puppeteer --cmd cat --steps-file - --connect-wait 0.2 --step-delay 0.3 --settle 0.3 | grep -q hi
          # 0.6.0's cap/readback pair, end to end on the installed wheel:
          # the complete artifact goes to the file, --show pages it back.
          /tmp/scratch-venv/bin/terminal-puppeteer --cmd cat --capture-out /tmp/tp-cap.bin --connect-wait 0.2 --step-delay 0.3 --settle 0.3 hi
          /tmp/scratch-venv/bin/terminal-puppeteer --show /tmp/tp-cap.bin --tail 1 | grep -q hi
