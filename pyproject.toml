[project]
name = "terminal-puppeteer"
version = "0.2.0"
description = "Let an LLM agent drive a real interactive program through a pty"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# terminal-puppeteer.py is a thin wrapper (see its own docstring) around
# the real implementation in terminal_puppeteer/ -- both need installing.
#
# The wrapper's hyphenated name is deliberate, not leftover: it was
# briefly renamed to terminal_puppeteer.py (matching the package) and
# that broke a real, verified case. `script-files` installs the wrapper
# alone into <venv>/bin/, separately from the package (which `packages`
# installs into site-packages) -- a script's own directory is always
# first on sys.path, so a wrapper named identically to the package it
# imports shadows the real package with itself (a lone, non-package
# module) before Python ever reaches site-packages, raising
# "ModuleNotFoundError: ... 'terminal_puppeteer' is not a package". A
# plain checkout never hits this (the sibling terminal_puppeteer/
# directory sitting right next to the wrapper wins over the wrapper
# itself), which is exactly why it wasn't caught until actually
# installing the built wheel into a scratch venv and running it for
# real, not just running it in place. Keeping the wrapper's name
# different from the package's makes the collision impossible instead
# of avoided by directory-layout luck.
[tool.setuptools]
packages = ["terminal_puppeteer"]
script-files = ["terminal-puppeteer.py"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/terminal-puppeteer.1"]
