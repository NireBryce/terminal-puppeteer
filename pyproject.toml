[project]
name = "terminal-puppeteer"
version = "0.6.0"
description = "Let an LLM agent drive a real interactive program through a pty"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[project.scripts]
terminal-puppeteer = "terminal_puppeteer.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# terminal-puppeteer.py at the repo root (a thin wrapper) is for running
# straight from a checkout, no install needed -- the one thing no
# packaging mechanism replaces. [project.scripts] above is the separate,
# idiomatic story for `pip install`: setuptools generates a proper
# `terminal-puppeteer` command (no .py) at install time, with a correct
# shebang and a direct reference to terminal_puppeteer.cli:main -- not a
# copy of a source file, so no `script-files` is needed anymore. The two
# names being different (with vs. without .py) is deliberate: naming the
# root wrapper identically to the package it imports was tried and
# reverted after it broke every installed invocation -- see CLAUDE.md's
# "terminal-puppeteer.py's hyphenated name is deliberate" entry for the
# fuller account of why.
# The underscore in "terminal_puppeteer" is required, not a leftover: it is
# the importable package name, and a hyphen isn't a valid Python identifier.
# The hyphenated `name` above is the distribution/command name; packaging
# tools normalize "-" and "_" as equivalent there, so they're one project.
[tool.setuptools]
packages = ["terminal_puppeteer"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/terminal-puppeteer.1"]
