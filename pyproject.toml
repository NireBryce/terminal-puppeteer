[project]
name = "terminal-puppeteer"
version = "0.2.0"
description = "Let an LLM agent drive a real interactive program through a pty"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# terminal-puppeteer.py is meant to be run directly (see README's Quick
# start), not imported -- its hyphenated filename isn't a valid Python
# module name anyway. `script-files` installs it as-is onto PATH rather
# than trying to package it as an importable module; without this,
# `pip install .` previously produced a wheel with no code in it at all
# (see issue #9).
[tool.setuptools]
# Without this, setuptools' automatic package-discovery treats man/ as an
# implicit package and copies it into the wheel root too, on top of the
# data-files copy below -- there are no actual Python packages here.
packages = []
script-files = ["terminal-puppeteer.py"]

[tool.setuptools.data-files]
"share/man/man1" = ["man/terminal-puppeteer.1"]
